[package]
name = "paraape-risk-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "0.10.7"
alloy-primitives = "1.5"
alloy-sol-types = "1.5"

[features]
export-abi = ["stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]
# `lib` keeps `cargo test --lib` on host (cdylib-only fails Stylus hostio on macOS).
# `cdylib` is required by `cargo stylus check` / `deploy` for WASM.

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
# "z" = size (Arbitrum Stylus troubleshooting); target ≤24 KB compressed → single fragment when possible
opt-level = "z"
