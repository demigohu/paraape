<svg width="680" height="410" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Protocol design</title>
<desc>Market Factory creates an Insurance Vault per token. The Vault connects to a Policy Registry tracking buyer positions, a Stylus Risk Engine computing dynamic premiums, and a TWAP Reader that reads price data from Uniswap V4.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#353535" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="240" y="30" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Market factory</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Creates isolated markets</text>

<rect x="235" y="160" width="210" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="180" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Insurance vault</text>
<text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Core accounting, pays claims</text>

<rect x="30" y="170" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="120" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Policy registry</text>
<text x="120" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Tracks buyer positions</text>

<rect x="470" y="170" width="165" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="552" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Stylus risk engine</text>
<text x="552" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Prices premiums live</text>

<rect x="250" y="310" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">TWAP reader</text>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Reads Uniswap v4 pool</text>

<line x1="340" y1="86" x2="340" y2="158" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="210" y1="198" x2="233" y2="205" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="470" y1="198" x2="447" y2="205" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="308" x2="340" y2="226" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
</svg>
