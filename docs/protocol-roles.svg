<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Protocol roles</title>
<desc>Four roles surround the Insurance Vault: LP deposits USDG, Buyer purchases protection, Keeper triggers settlement, and the Uniswap V4 Pool supplies TWAP data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#353535" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="60" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">LP (underwriter)</text>
<text x="130" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Deposits USDG capital</text>

<rect x="460" y="60" width="180" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="550" y="80" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Buyer (trader)</text>
<text x="550" y="98" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Buys crash protection</text>

<rect x="250" y="240" width="200" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="350" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Insurance vault</text>
<text x="350" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Holds funds, pays claims</text>

<rect x="40" y="440" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="130" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Keeper</text>
<text x="130" y="478" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Triggers settlement</text>

<rect x="460" y="440" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Uniswap v4 pool</text>
<text x="550" y="478" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">TWAP price source</text>

<line x1="180" y1="110" x2="290" y2="245" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="500" y1="110" x2="410" y2="245" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="180" y1="450" x2="290" y2="300" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="500" y1="450" x2="410" y2="300" stroke="#353535" stroke-width="0.5" marker-end="url(#arrow)"/>
</svg>
